name: Vial
description: >-
  Vial is a next-generation biotech company advancing first and best-in-class
  biologics to treat unmet need in Immunology and Inflammation. The company pairs
  AI-driven drug discovery with automated, technology-enabled clinical trials,
  working across target discovery (identifying high-value therapeutic targets),
  molecule design (generating and optimizing molecular candidates), and
  experimental validation (high-throughput approaches to accelerate development).
  Its lead pipeline program is an IL-13 x TSLP bi-specific antibody in Phase 1.
  Vial was originally built as a tech-enabled contract research organization (CRO)
  focused on reimagining clinical trials, and was backed by General Catalyst. This
  profile is maintained in the API Evangelist network; as of this enrichment pass
  Vial publishes no public developer, API, or documentation surface.
